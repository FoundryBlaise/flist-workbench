# Mutations for the mutation probe (scripts/mutation_probe/probe.py).
# How to run it and read the result: docs/MUTATION_PROBE.md.
#
# Each [[mutation]] is one small realistic bug:
#   id       A = sidecar archive (Workbench, Backups, Trash, Upload),
#            L = sidecar Logs, Labels, Index, search and MCP,
#            R = renderer. Ids are stable; never renumber.
#   suite    "sidecar" (pytest) or "renderer" (vitest)
#   file     repo-relative file the mutation edits
#   find     exact text, must occur exactly once in `file`
#   replace  what it becomes
#   breaks   the behaviour it breaks, in GLOSSARY.md terms
#   tests    repo-relative test files, globs, or @group from [groups]
#   audit    verdict before spec #9: the October 2026 audit runs for A and L;
#            R and A06 re-measured with this tool on main 77d79c4 (the
#            audit's renderer log was lost, and A06 did not apply then)
#   spec     the spec whose tests should kill it if it survives
#            (9 = should already be killed by spec #9's fixtures)
#
# find/replace are TOML multi-line literal strings: the newline right after
# the opening ''' is dropped, everything else is byte-exact.
# When code moves, re-anchor the find text (`probe.py --check` lists stale
# entries); do not drop the mutation.

[groups]
archive = [
  "sidecar/tests/test_character_archive.py",
  "sidecar/tests/test_workbench_api.py",
  "sidecar/tests/test_working_copy.py",
  "sidecar/tests/test_working_sets_v2_api.py",
  "sidecar/tests/test_working_sets_v2_storage.py",
  "sidecar/tests/test_set_bundle.py",
  "sidecar/tests/test_image_trash.py",
  "sidecar/tests/test_pool_api.py",
  "sidecar/tests/test_adopt_image_ids.py",
  "sidecar/tests/test_repair_gallery.py",
  "sidecar/tests/test_restore_extension.py",
  "sidecar/tests/test_restore_saved.py",
  "sidecar/tests/test_zip_serialise.py",
  "sidecar/tests/test_profile.py",
  "sidecar/tests/test_flist_api.py",
  "sidecar/tests/test_flist_api_endpoints.py",
  "sidecar/tests/test_foreign.py",
  "sidecar/tests/test_settings.py",
  "sidecar/tests/test_events.py",
  "sidecar/tests/test_health.py",
  "sidecar/tests/test_render.py",
  "sidecar/tests/test_flist_activity.py",
  "sidecar/tests/test_data_invariants.py",
]
logs = [
  "sidecar/tests/test_parser.py",
  "sidecar/tests/test_log_records.py",
  "sidecar/tests/test_logs.py",
  "sidecar/tests/test_logs_aliases.py",
  "sidecar/tests/test_two_characters.py",
  "sidecar/tests/test_aliases.py",
  "sidecar/tests/test_aliases_api.py",
  "sidecar/tests/test_labels.py",
  "sidecar/tests/test_chunker.py",
  "sidecar/tests/test_rag_*.py",
]
mcp = ["sidecar/tests/test_mcp_*.py"]
renderer = ["renderer/**/*.test.ts", "renderer/**/*.test.tsx"]



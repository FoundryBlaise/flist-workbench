[project]
name = "flist-workbench-sidecar"
version = "0.0.0"
description = "Python sidecar for F-list Workbench."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # python-multipart: no route here reads form data or file uploads
  # any more. The mcp SDK depends on it anyway (its OAuth handlers read
  # forms), so dropping this line would not take it out of the build.
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  # qdrant-client in embedded mode persists vectors to a folder on
  # disk — no docker, no port 6333. Pin major because the local-mode
  # API still tightens occasionally.
  "qdrant-client>=1.12,<2",
  # fastembed runs both models in-process on onnxruntime: the embedding
  # model (rag_embed_local) and the cross-encoder reranker (rag_rerank).
  # Avoids torch (~2 GB) and CUDA detection. Each model downloads on
  # first use into `models/` in the app's data folder: ~220 MB for the
  # default embedding model, ~1.1 GB for the default reranker.
  "fastembed>=0.7,<1",
  # Model Context Protocol server, mounted at /mcp. This is the
  # reference SDK's bundled FastMCP (`mcp.server.fastmcp`), not the
  # third-party `fastmcp` 2.x package. docs/MCP_DESIGN.md originally
  # picked fastmcp 2.x, but it eagerly imports redis, docket, authlib,
  # joserfc, opentelemetry, cloudpickle and beartype at `import
  # fastmcp` time — 20+ extra packages that PyInstaller would have to
  # pack into the sidecar for features (distributed task queues, OAuth
  # providers, server proxying) this app never uses. The reference SDK carries everything we do need: typed tool
  # decorators with annotations, Context.report_progress,
  # streamable_http_app(), prompts, resources and
  # TransportSecuritySettings for DNS-rebinding protection.
  "mcp>=1.18,<2",
  # Pillow reads image dimensions and re-encodes oversized imports as
  # JPEG (services/image_import, `convert_to_jpeg`). fastembed already
  # pulls it in; naming it here keeps that working if fastembed ever
  # drops it.
  "pillow>=10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.32",
  "httpx>=0.28",
  # PyInstaller is what `npm run pack:sidecar` invokes to produce
  # sidecar.exe for the Windows builds. It only runs on the build host,
  # never inside the shipped app, so dev-group is the right home. Pinned major to avoid surprise PyInstaller-5→6 style
  # CLI breakage; bump the floor when the build script needs a newer
  # one.
  "pyinstaller>=6,<7",
  # The sidecar's linter (CI's Sidecar job). Pinned minor: ruff moves
  # rules between minors.
  "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The short summary lists failures, errors and skips, so the name of a
# failed test survives `| tail`. Passing `-rs` alone would replace
# pytest's default `-rfE` and drop the FAILED lines.
addopts = "-rfEs"

# `uv run --no-sync ruff check` from sidecar/. A small rule set: real
# mistakes (pyflakes) and exceptions swallowed without a word. A
# deliberate best-effort `except Exception: pass` says why in its noqa.
[tool.ruff.lint]
select = ["F", "E722", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are imported by name and then taken as a test argument
# (`from two_characters import two_characters  # noqa: F401`).
"tests/**" = ["F811"]
